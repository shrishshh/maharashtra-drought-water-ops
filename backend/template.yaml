AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  JalNyay (Maharashtra Drought Water Ops) backend - async job API around the City
  (WNTR) and Village (OR-Tools) engines. Region ap-south-1. All data is sample or
  SIMULATED data (see labels in the responses).

Parameters:
  WorkerReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >
      Reserved concurrency per worker Lambda (0 = none). This account's total Lambda
      concurrency limit is 10 and AWS keeps 10 unreserved, so any value > 0 fails
      until a quota increase is granted. The account limit itself caps all workers.
  RouteMatrixKey:
    Type: String
    Default: precomputed/route_matrix_tuljapur.json
    Description: S3 key of the cached Amazon Location route matrix (haversine fallback if absent).

Conditions:
  HasReservedConcurrency: !Not [!Equals [!Ref WorkerReservedConcurrency, 0]]

Globals:
  Function:
    Architectures: [x86_64]
    Tags:
      project: jalnyay
    Environment:
      Variables:
        BUCKET: !Ref DataBucket
        JOBS_TABLE: !Ref JobsTable
        VILLAGES_TABLE: !Ref VillagesTable

Resources:
  # ------------------------------------------------------------------ data
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub jalnyay-data-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      LifecycleConfiguration:
        Rules:
          - Id: expire-job-payloads
            Status: Enabled
            Prefix: jobs/
            ExpirationInDays: 7
          # AWS Service Terms 82.4(a)(i): Amazon Location route results may be cached <= 30 days
          - Id: expire-cached-route-matrix
            Status: Enabled
            Prefix: precomputed/route_matrix
            ExpirationInDays: 30
      Tags: [{Key: project, Value: jalnyay}]

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt DataBucket.Arn, !Sub "${DataBucket.Arn}/*"]
            Condition: {Bool: {"aws:SecureTransport": "false"}}

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: jalnyay-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: job_id, AttributeType: S}]
      KeySchema: [{AttributeName: job_id, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      SSESpecification: {SSEEnabled: true}
      Tags: [{Key: project, Value: jalnyay}]

  VillagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: jalnyay-villages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: village_id, AttributeType: S}]
      KeySchema: [{AttributeName: village_id, KeyType: HASH}]
      SSESpecification: {SSEEnabled: true}
      Tags: [{Key: project, Value: jalnyay}]

  # ------------------------------------------------------------------ logs (7 days)
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /jalnyay/api, RetentionInDays: 7, Tags: [{Key: project, Value: jalnyay}]}
  CityEvaluateLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /jalnyay/city-evaluate, RetentionInDays: 7, Tags: [{Key: project, Value: jalnyay}]}
  VillagePlanLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /jalnyay/village-plan, RetentionInDays: 7, Tags: [{Key: project, Value: jalnyay}]}
  VillageFleetLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /jalnyay/village-fleet, RetentionInDays: 7, Tags: [{Key: project, Value: jalnyay}]}
  VillageFraudLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /jalnyay/village-fraud, RetentionInDays: 7, Tags: [{Key: project, Value: jalnyay}]}

  # ------------------------------------------------------------------ API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: JalNyay public API (CORS * for now; locked to the Amplify URL in Part E)
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10
      Tags:
        project: jalnyay

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: JalNyay HTTP API (async jobs + read-only endpoints)
      CodeUri: src/
      Handler: jalnyay_backend.api.handler
      Runtime: python3.12
      MemorySize: 256
      Timeout: 15
      LoggingConfig: {LogGroup: !Ref ApiLogs}
      Environment:
        Variables:
          WORKER_CITY_EVALUATE: !Ref CityEvaluateFunction
          WORKER_VILLAGE_PLAN: !Ref VillagePlanFunction
          WORKER_VILLAGE_FLEET: !Ref VillageFleetFunction
          WORKER_VILLAGE_FRAUD: !Ref VillageFraudFunction
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref JobsTable}
        - DynamoDBReadPolicy: {TableName: !Ref VillagesTable}
        - S3CrudPolicy: {BucketName: !Ref DataBucket}
        - LambdaInvokePolicy: {FunctionName: !Ref CityEvaluateFunction}
        - LambdaInvokePolicy: {FunctionName: !Ref VillagePlanFunction}
        - LambdaInvokePolicy: {FunctionName: !Ref VillageFleetFunction}
        - LambdaInvokePolicy: {FunctionName: !Ref VillageFraudFunction}
      Events:
        PostJob: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: POST, Path: /jobs}}
        GetJob: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: GET, Path: "/jobs/{id}"}}
        CityScenarios: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /city/scenarios}}
        Villages: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /village/villages}}
        PlanLatest: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /village/plan/latest}}

  # ------------------------------------------------------------------ workers (container images)
  CityEvaluateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: city_evaluate worker (WNTR, EPA Net3 sample network)
      PackageType: Image
      ImageConfig: {Command: [jalnyay_backend.city_worker.handler]}
      MemorySize: 3008
      Timeout: 300
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref WorkerReservedConcurrency, !Ref AWS::NoValue]
      LoggingConfig: {LogGroup: !Ref CityEvaluateLogs}
      EventInvokeConfig: {MaximumRetryAttempts: 0, MaximumEventAgeInSeconds: 600}
      Policies:
        - S3CrudPolicy: {BucketName: !Ref DataBucket}
        - DynamoDBCrudPolicy: {TableName: !Ref JobsTable}
    Metadata:
      DockerContext: ..
      Dockerfile: backend/docker/city.Dockerfile
      DockerTag: city

  VillagePlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: village_plan worker (OR-Tools routing)
      PackageType: Image
      ImageConfig: {Command: [jalnyay_backend.village_worker.plan_handler]}
      MemorySize: 2048
      Timeout: 120
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref WorkerReservedConcurrency, !Ref AWS::NoValue]
      LoggingConfig: {LogGroup: !Ref VillagePlanLogs}
      EventInvokeConfig: {MaximumRetryAttempts: 0, MaximumEventAgeInSeconds: 600}
      Environment:
        Variables:
          ROUTE_MATRIX_KEY: !Ref RouteMatrixKey
      Policies:
        - S3CrudPolicy: {BucketName: !Ref DataBucket}
        - DynamoDBCrudPolicy: {TableName: !Ref JobsTable}
    Metadata:
      DockerContext: ..
      Dockerfile: backend/docker/village.Dockerfile
      DockerTag: village

  VillageFleetFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: village_fleet worker (fleet-size sweep, sequential solves)
      PackageType: Image
      ImageConfig: {Command: [jalnyay_backend.village_worker.fleet_handler]}
      MemorySize: 2048
      Timeout: 900
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref WorkerReservedConcurrency, !Ref AWS::NoValue]
      LoggingConfig: {LogGroup: !Ref VillageFleetLogs}
      EventInvokeConfig: {MaximumRetryAttempts: 0, MaximumEventAgeInSeconds: 600}
      Environment:
        Variables:
          ROUTE_MATRIX_KEY: !Ref RouteMatrixKey
      Policies:
        - S3CrudPolicy: {BucketName: !Ref DataBucket}
        - DynamoDBCrudPolicy: {TableName: !Ref JobsTable}
    Metadata:
      DockerContext: ..
      Dockerfile: backend/docker/village.Dockerfile
      DockerTag: village

  VillageFraudFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: village_fraud worker (GPS vs claimed trips)
      PackageType: Image
      ImageConfig: {Command: [jalnyay_backend.village_worker.fraud_handler]}
      MemorySize: 1024
      Timeout: 60
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref WorkerReservedConcurrency, !Ref AWS::NoValue]
      LoggingConfig: {LogGroup: !Ref VillageFraudLogs}
      EventInvokeConfig: {MaximumRetryAttempts: 0, MaximumEventAgeInSeconds: 600}
      Policies:
        - S3CrudPolicy: {BucketName: !Ref DataBucket}
        - DynamoDBCrudPolicy: {TableName: !Ref JobsTable}
    Metadata:
      DockerContext: ..
      Dockerfile: backend/docker/village.Dockerfile
      DockerTag: village

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  BucketName:
    Value: !Ref DataBucket
  JobsTableName:
    Value: !Ref JobsTable
  VillagesTableName:
    Value: !Ref VillagesTable
  CityEvaluateFunctionName:
    Value: !Ref CityEvaluateFunction
  VillagePlanFunctionName:
    Value: !Ref VillagePlanFunction
  VillageFleetFunctionName:
    Value: !Ref VillageFleetFunction
  VillageFraudFunctionName:
    Value: !Ref VillageFraudFunction
  RouteMatrixKey:
    Value: !Ref RouteMatrixKey
