# SAM CLI config. Run sam commands from backend/.
# `sam deploy` ALWAYS shows the change set and asks before executing (confirm_changeset).
version = 0.1

[default.global.parameters]
stack_name = "jalnyay"
region = "ap-south-1"

[default.validate.parameters]
lint = true

[default.build.parameters]
parallel = true
cached = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
resolve_s3 = true
resolve_image_repos = true
tags = "project=\"jalnyay\""
